<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TS UI</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.0/ace.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mistreevous@latest/dist/mistreevous.min.js"></script>
    <link rel="stylesheet" href="styles/index.css">
    <link rel="stylesheet" href="styles/toast.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body class="dark-mode">
    <header>
        <div class="header-title">TS Interface</div>
        <div class="header-controls">
            <button id="mobileExecuteButton" class="btn btn-primary" onclick="executeFile()" title="Run">▶ Run</button>
        </div>
        <button class="theme-toggle" id="themeToggle" title="Toggle theme">🌙</button>
    </header>

    <div class="sidebar">
        <div class="sidebar-content">
            <button class="sidebar-toggle" id="sidebarToggle" title="Toggle sidebar">≡</button>
            
            <div class="rename-container">
                <input type="text" class="rename-input" id="renameInput" placeholder="New filename">
                <button class="btn btn-primary" onclick="renameFile()" data-tooltip="Rename">✓</button>
            </div>
            
            <select id="fileList"></select>
            
            <button class="btn btn-primary" onclick="newFile()" data-tooltip="New File">New File</button>
            <button class="btn btn-primary" onclick="loadFile()" data-tooltip="Load">Load</button>
            <button class="btn btn-danger" onclick="confirmArchive()" data-tooltip="Archive">Archive</button>
            
            <div class="button-group">
                <button class="btn btn-primary" onclick="saveFile()" data-tooltip="Save">Save</button>
                <button class="btn btn-primary" id="executeButton" onclick="executeFile()" data-tooltip="Run">Run</button>
            </div>
        </div>
    </div>

    <div class="editor-container">
        <div id="editor"></div>
    </div>

    <div class="console-container">
        <div class="console-header">
            <div class="console-header-title">Console Output</div>
            <div class="console-controls">
                <label class="autoscroll-toggle">
                    <span>Autoscroll</span>
                    <div class="checkbox-container">
                        <input type="checkbox" id="autoscrollCheckbox" checked>
                        <span class="checkbox-slider"></span>
                    </div>
                </label>
            </div>
        </div>
        <div class="console-output" id="consoleOutput"></div>
    </div>

    <div class="interative-container">
        <div class="behaviour-tree-container">
            <div class="dropdown-header" id="bt-dropdownHeader">
                <span>Behaviour Tree</span>
                <svg id="bt-dropdown-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 21 12 15 18 21"></polyline>
                </svg>
            </div>
            <div class="dropdown-content" id="bt-dropdown-content">
                <div class="behaviour-tree-display" id="behaviour-tree-display"></div>
            </div>

            <script src="scripts/behaviourTree.js"></script>
        </div>
        <div class="field-display-container">
            <div class="dropdown-header" id="fd-dropdownHeader">
                <span>Show Field</span>
                <svg id="fd-dropdown-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 21 12 15 18 21"></polyline>
                </svg>
            </div>
            <div class="dropdown-content" id="fd-dropdown-content">
                <canvas 
                    class="field-display"
                    id="field-display">
                </canvas>
            </div>

            <script src="scripts/fieldDisplay.js"></script>
        </div>
        <script src="scripts/interactiveContainer.js"></script>
    </div>

    <script src="scripts/index.js"></script>
</body>
</html>
