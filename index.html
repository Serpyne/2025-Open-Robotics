<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robotics Interface</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.4.12/ace.js"></script>
    <link rel="stylesheet" href="styles/index.css">
    <link rel="stylesheet" href="styles/toast.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>
    <h1>Team Susmita</h1>
    
    <form action="/upload" method="post" enctype="multipart/form-data" id="upload-form">
        <label for="file-upload" class="file-upload">Upload Script</label>
        <input id="file-upload" type="file" name="file">
    </form>

    <div>
        <button class="menu-elements" onclick="newFile()">New</button>
        <button class="menu-elements" onclick="deleteFile()">Delete</button>
        <button class="menu-elements" onclick="loadFile()">Load</button>
        <button class="menu-elements" onclick="saveFile()">Save</button>
        <button class="menu-elements" id="executeButton" onclick="executeFile()">Execute</button>
        <select class="menu-elements" id="fileList"></select>
    </div>
    <div style="display: inline-flex; width: 100%; height: 80%; flex-direction: row;">
    <div id="editor"></div>
    <div id="console-box">
        <div id="console-elements">
            <span id="autoScrollDiv">
                <input type="checkbox" id="autoScrollButton">
                <label for="autoScrollButton">Auto-Scroll</label>
            </span>
            <button id="clear-console-button" onclick="clearOutput();">Clear</button>
        </div>
        <p id="output"></p>
    </div>
    </div>

    <div id="toast-overlay"></div>

    <script>
        document.getElementById("file-upload").onchange = function() {
            document.getElementById("upload-form").submit();
        };
        document.getElementById("fileList").onchange = function() {
            loadFile();
        };

        var editor = ace.edit("editor");
        editor.setTheme("ace/theme/monokai");
        editor.session.setMode("ace/mode/python");

        function updateFileList() {
            fetch('/list')
                .then(response => response.text())
                .then(data => {
                    const files = data.split('\n');
                    const select = document.getElementById('fileList');
                    select.innerHTML = '';
                    files.forEach(file => {
                        const option = document.createElement('option');
                        option.text = file;
                        select.add(option);
                    });
                });
        }

        function newFile() {
            fetch(`/new`)
                .then(response => response.text())
                .then(data => {
                    let filename = data.toString();
                    console.log(filename);
                    updateFileList();
                    setTimeout(`document.getElementById('fileList').value = '${filename}';`, 10);
                    setTimeout("loadFile();", 100);
                    showToast(`New file '${filename}' created.`);
                });
        }

        function deleteFile() {
            const filename = document.getElementById('fileList').value;
            fetch(`/delete/${filename}`)
                .then(response => response.text())
                .then(data => {
                    updateFileList();
                    setTimeout("loadFile();", 100);
                    showToast(`'${filename}' deleted.`);
                });
        }

        function loadFile() {
            const filename = document.getElementById('fileList').value;
            fetch(`/load/${filename}`)
                .then(response => response.text())
                .then(data => {
                    editor.setValue(data);
                });
        }

        function saveFile() {
            const filename = document.getElementById('fileList').value;
            const content = editor.getValue();
            fetch('/save', {
                method: 'POST',
                body: `${filename}:${content}`
            }).then(response => {
                showToast(`'${filename}' saved.`);
            });
        }

        const autoScrollButton = document.getElementById("autoScrollButton");
        var autoScroll = true;
        autoScrollButton.checked = autoScroll;
        autoScrollButton.onchange = function(event) {
            autoScroll = autoScrollButton.checked;
        }

        const executeButton = document.getElementById("executeButton");
        const consoleBox = document.getElementById("console-box");
        const outputBox = document.getElementById("output");

        function executeFile() {
            executeButton.innerText = "Stop";
            const filename = document.getElementById('fileList').value;
            const socket = new WebSocket(`ws://raspberrypi.local:8765/${filename}`);
            socket.onmessage = function(event) {
                if (event.data == "SCRIPT_ENDED_SIGNAL") {
                    executeButton.innerText = "Execute";
                    showToast(`'${filename}' ended.`)
                    return;
                }
                let line = event.data;
                outputBox.innerText += line;
                if (autoScroll == true) {
                    consoleBox.scrollTop = consoleBox.scrollHeight;
                }
            };
        }

        function clearOutput() {
            outputBox.innerText = "";
        }

        document.addEventListener('keydown', e => {
            if (e.ctrlKey && e.key === 's') {
                e.preventDefault();
                saveFile();
            }
        });

        let icon = {
            success:
            '<span class="material-symbols-outlined">task_alt</span>',
            danger:
            '<span class="material-symbols-outlined">error</span>',
            warning:
            '<span class="material-symbols-outlined">warning</span>',
            info:
            '<span class="material-symbols-outlined">info</span>',
        };
        function showToast(
            message = "Sample Message",
            toastType = "info",
            duration = 5000) {
            if (!Object.keys(icon).includes(toastType))
                toastType = "info";

            let box = document.createElement("div");
            box.classList.add(
                "toast", `toast-${toastType}`);
            box.innerHTML = ` <div class="toast-content-wrapper">
                        <div class="toast-icon">
                        ${icon[toastType]}
                        </div>
                        <div class="toast-message">${message}</div>
                        <div class="toast-progress"></div>
                        </div>`;
            duration = duration || 5000;
            box.querySelector(".toast-progress").style.animationDuration =
                    `${duration / 1000}s`;

            let toastAlready = 
                document.body.querySelector(".toast");
            if (toastAlready) {
                toastAlready.remove();
            }

            document.body.appendChild(box)
        };
        
        updateFileList();
        setTimeout("loadFile();", 100);
    </script>
</body>
</html>
