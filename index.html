<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robotics Interface</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.4.12/ace.js"></script>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <h1>Robotics Interface</h1>
    
    <form action="/upload" method="post" enctype="multipart/form-data" id="upload-form">
        <label for="file-upload" class="file-upload">Upload Script</label>
        <input id="file-upload" type="file" name="file">
    </form>

    <div>
        <button class="menu-elements" onclick="newFile()">New</button>
        <button class="menu-elements" onclick="deleteFile()">Delete</button>
        <button class="menu-elements" onclick="loadFile()">Load</button>
        <button class="menu-elements" onclick="saveFile()">Save</button>
        <button class="menu-elements" onclick="executeFile()">Execute</button>
        <select class="menu-elements" id="fileList"></select>
    </div>
    <div style="display: inline-flex; width: 100%; height: 80%; flex-direction: row;">
    <div id="editor"></div>
    <div id="output"></div>
    </div>

    <script>
        document.getElementById("file-upload").onchange = function() {
            document.getElementById("upload-form").submit();
        };
        document.getElementById("fileList").onchange = function() {
            loadFile();
        };

        var editor = ace.edit("editor");
        editor.setTheme("ace/theme/monokai");
        editor.session.setMode("ace/mode/python");

        function updateFileList() {
            fetch('/list')
                .then(response => response.text())
                .then(data => {
                    const files = data.split('\n');
                    const select = document.getElementById('fileList');
                    select.innerHTML = '';
                    files.forEach(file => {
                        const option = document.createElement('option');
                        option.text = file;
                        select.add(option);
                    });
                });
        }

        function newFile() {
            const filename = document.getElementById('fileList').value;
            fetch(`/new/${filename}`)
                .then(response => response.text())
                .then(data => {
                    editor.setValue(data);
                    updateFileList();
                });
        }

        function deleteFile() {
            const filename = document.getElementById('fileList').value;
            fetch(`/delete/${filename}`)
                .then(response => response.text())
                .then(data => {
                    editor.setValue(data);
                    updateFileList();
                });
        }

        function loadFile() {
            const filename = document.getElementById('fileList').value;
            fetch(`/load/${filename}`)
                .then(response => response.text())
                .then(data => {
                    editor.setValue(data);
                });
        }

        function saveFile() {
            const filename = document.getElementById('fileList').value;
            const content = editor.getValue();
            fetch('/save', {
                method: 'POST',
                body: `${filename}:${content}`
            });
        }

        function executeFile() {
            const filename = document.getElementById('fileList').value;
            fetch('/execute', {
                method: 'POST',
                body: filename
            })
            .then(response => response.text())
            .then(data => {
                document.getElementById('output').innerText = data;
            });
        }

        updateFileList();
    </script>
</body>
</html>
