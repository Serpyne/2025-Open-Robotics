<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TS UI</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.0/ace.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mistreevous@latest/dist/mistreevous.min.js"></script>
    <link rel="stylesheet" href="styles/index.css">
    <link rel="stylesheet" href="styles/toast.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body class="dark-mode">
    <header>
        <div class="header-title">TS Interface</div>
        <div class="header-controls">
            <button id="mobileExecuteButton" class="btn btn-primary" onclick="executeFile()" title="Run">▶ Run</button>
        </div>
        <button class="theme-toggle" id="themeToggle" title="Toggle theme">🌙</button>
    </header>

    <div class="sidebar">
        <div class="sidebar-content">
            <button class="sidebar-toggle" id="sidebarToggle" title="Toggle sidebar">≡</button>
            
            <div class="rename-container">
                <input type="text" class="rename-input" id="renameInput" placeholder="New filename">
                <button class="btn btn-primary" onclick="renameFile()" data-tooltip="Rename">✓</button>
            </div>
            
            <select id="fileList"></select>
            
            <button class="btn btn-primary" onclick="newFile()" data-tooltip="New File">New File</button>
            <button class="btn btn-primary" onclick="loadFile()" data-tooltip="Load">Load</button>
            <button class="btn btn-danger" onclick="confirmArchive()" data-tooltip="Archive">Archive</button>
            
            <div class="button-group">
                <button class="btn btn-primary" onclick="saveFile()" data-tooltip="Save">Save</button>
                <button class="btn btn-primary" id="executeButton" onclick="executeFile()" data-tooltip="Run">Run</button>
            </div>
        </div>
    </div>

    <div class="editor-container">
        <div id="editor"></div>
    </div>

    <div class="console-container">
        <div class="console-header">
            <div class="console-header-title">Console Output</div>
            <div class="console-controls">
                <label class="autoscroll-toggle">
                    <span>Autoscroll</span>
                    <div class="checkbox-container">
                        <input type="checkbox" id="autoscrollCheckbox" checked>
                        <span class="checkbox-slider"></span>
                    </div>
                </label>
            </div>
        </div>
        <div class="console-output" id="consoleOutput"></div>
    </div>

    <div class="interative-container">
        <div class="behaviour-tree-container">
            <div class="dropdown-header" id="bt-dropdownHeader">
                <span>Behaviour Tree</span>
                <svg id="bt-dropdown-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 21 12 15 18 21"></polyline>
                </svg>
            </div>
            <div class="dropdown-content" id="bt-dropdown-content">
                <textarea 
                    class="behaviour-tree-display"
                    id="behaviour-tree-display">
root {
    sequence {
        action [Walk]
        action [Fall]
        action [Laugh]
    }
}
                </textarea>
            </div>

            <script>
                const { BehaviourTree, State } = mistreevous;

                const behaviourTreeTextEntry = document.getElementById("behaviour-tree-display");
                var treeDefinition, agent, tree;
                var ballVisible = false;
                var ballFront = false;
                
                agent = {
                    driveToGoal: () => {console.log("driveToGoal"); return State.SUCCEEDED;},
                    driveToBall: () => {console.log("driveToBall"); return State.SUCCEEDED;},
                    predictBallPath: () => {console.log("predictBallPath"); return State.SUCCEEDED;},
                    collectBall: () => {console.log("collectBall"); return State.SUCCEEDED;},
                    determineSide: () => {console.log("determineSide"); return State.SUCCEEDED;},
                    saveTurnDirectionToBlackboard: () => {console.log("saveTurnDirectionToBlackboard"); return State.SUCCEEDED;},
                    saveTargetPosToBlackboard: () => {console.log("saveTargetPosToBlackboard"); return State.SUCCEEDED;},
                    turnToFaceDirection: () => {console.log("turnToFaceDirection"); return State.SUCCEEDED;},
                    driveToTargetPos: () => {console.log("driveToTargetPos"); return State.SUCCEEDED;},
                    turnToFaceGoal: () => {console.log("turnToFaceGoal"); return State.SUCCEEDED;},
                    shoot: () => {console.log("shoot"); return State.SUCCEEDED;},

                    checkIfBallIsNotVisible: () => {if (!ballVisible) {return State.SUCCEEDED;} else {return State.FAILED;}},
                    checkIfBallIsVisible: () => {if (ballVisible) {return State.SUCCEEDED;} else {return State.FAILED;}},
                    conditionBallBehind: () => {if (!ballFront) {return State.SUCCEEDED;} else {return State.FAILED;}},
                    conditionBallFront: () => {if (ballFront) {return State.SUCCEEDED;} else {return State.FAILED;}}
                };

                function startTree() {
                    tree = new BehaviourTree(treeDefinition, agent);
                    tree.step();
                }

                function loadTree() {
                    fetchTree().then(data => {
                        treeDefinition = JSON.parse(data);
                        behaviourTreeTextEntry.value = JSON.stringify(treeDefinition, null, 4);
                        console.log(treeDefinition);
                        
                        startTree();
                    });
                }

                function fetchTree() {
                    return fetch(`/bt`, {
                        method: 'POST',
                        body: ""
                    }).then(response => response.text())
                }
                function saveTree(_json) {
                    return fetch(`/bt`, {
                        method: 'POST',
                        body: JSON.stringify(_json)
                    }).then(response => response.text())
                }

                window.addEventListener("load", () => {setTimeout("loadTree();", 100)});
                behaviourTreeTextEntry.addEventListener("input", () => {
                    try {
                        treeDefinition = JSON.parse(behaviourTreeTextEntry.value);
                        saveTree(treeDefinition);
                    } catch (e) {
                        console.log("Invalid ", e);
                    }
                });
            </script>
        </div>
        <div class="field-display-container">
            <div class="dropdown-header" id="fd-dropdownHeader">
                <span>Show Field</span>
                <svg id="fd-dropdown-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 21 12 15 18 21"></polyline>
                </svg>
            </div>
            <div class="dropdown-content" id="fd-dropdown-content">
                <canvas 
                    class="field-display"
                    id="field-display">
                </canvas>
            </div>
            
            <script>
                const clickDelay = 100;
                const BTDropdownContainer = document.getElementById('behaviour-tree-container')
                const BTDropdownHeader = document.getElementById('bt-dropdownHeader');
                const BTDropdownContent = document.getElementById('bt-dropdown-content');
                const BTDropdownIcon = document.getElementById('bt-dropdown-icon');
                const BTTextarea = document.getElementById('behaviour-tree-display');

                BTDropdownHeader.addEventListener('click', () => {
                    BTDropdownHeader.classList.toggle('active');
                    BTDropdownContent.classList.toggle('open');
                    BTDropdownIcon.classList.toggle('rotate');
                    
                    if (BTDropdownContent.classList.contains('open')) {
                        setTimeout(() => {
                            BTTextarea.focus();
                        }, clickDelay);
                    }
                });

                const FDDropdownContainer = document.getElementById('field-display-container')
                const FDDropdownHeader = document.getElementById('fd-dropdownHeader');
                const FDDropdownContent = document.getElementById('fd-dropdown-content');
                const FDDropdownIcon = document.getElementById('fd-dropdown-icon');
                const FDTextarea = document.getElementById('field-display');

                FDDropdownHeader.addEventListener('click', () => {
                    FDDropdownHeader.classList.toggle('active');
                    FDDropdownContent.classList.toggle('open');
                    FDDropdownIcon.classList.toggle('rotate');
                    
                    if (FDDropdownContent.classList.contains('open')) {
                        setTimeout(() => {
                            FDTextarea.focus();
                        }, clickDelay);
                    }
                });
            </script>

        </div>
    </div>

    <script>
        const editor = ace.edit("editor");
        editor.setTheme("ace/theme/monokai");
        editor.session.setMode("ace/mode/python");
        editor.setOption("copyWithEmptySelection", true);
        editor.setOptions({
            fontSize: "14px",
            enableBasicAutocompletion: true,
            enableLiveAutocompletion: true,
            showPrintMargin: false
        });

        const themeToggle = document.getElementById('themeToggle');
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            
            themeToggle.textContent = isLight ? '☀️' : '🌙';
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            
            const editor = ace.edit("editor");
            editor.setTheme(isLight ? "ace/theme/chrome" : "ace/theme/monokai");
            
            const consoleContainer = document.querySelector('.console-container');
            consoleContainer.classList.toggle('light-console', isLight);
        });

        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-mode');
            themeToggle.textContent = '☀️';
            ace.edit("editor").setTheme("ace/theme/chrome");
            document.querySelector('.console-container').classList.add('light-console');
        }

        const sidebarToggle = document.getElementById('sidebarToggle');
        const sidebar = document.querySelector('.sidebar');
        const mobileExecuteButton = document.getElementById('mobileExecuteButton');
        sidebarToggle.addEventListener('click', () => {
            sidebar.classList.toggle('collapsed');
            sidebarToggle.textContent = sidebar.classList.contains('collapsed') ? '≡' : '☰';
            mobileExecuteButton.style.display = sidebar.classList.contains('collapsed') ? 'block' : 'none';
        });

        const consoleOutput = document.getElementById('consoleOutput');
        const autoscrollCheckbox = document.getElementById('autoscrollCheckbox');
        
        function appendToConsole(text) {
            consoleOutput.textContent += text;
            if (autoscrollCheckbox.checked) {
                consoleOutput.scrollTop = consoleOutput.scrollHeight;
            }
        }

        const select = document.getElementById('fileList');
        select.addEventListener("change", () => {
            setTimeout("loadFile();", 100);
        });
                    
        function updateFileList() {
            fetch('/list')
                .then(response => response.text())
                .then(data => {
                    const files = data.split('\n');
                    select.innerHTML = '';
                    files.forEach(file => {
                        const option = document.createElement('option');
                        option.text = file;
                        select.add(option);
                    });
                });
        }

        function newFile() {
            fetch(`/new`)
                .then(response => response.text())
                .then(data => {
                    let filename = data.toString();
                    console.log(filename);
                    updateFileList();
                    setTimeout(`document.getElementById('fileList').value = '${filename}';`, 10);
                    setTimeout("loadFile();", 100);
                    showToast(`New file '${filename}' created.`);
                });
        }

        function confirmArchive() {
            const fileList = document.getElementById('fileList');
            const selectedFile = fileList.value;
            
            if (!selectedFile) {
                appendToConsole('> No file selected');
                return;
            }

            if (confirm(`Are you sure you want to archive "${selectedFile}"? This action cannot be undone.`)) {
                archiveFile();
            } else {
                appendToConsole('> Delete canceled');
            }
        }
        function archiveFile() {
            const filename = document.getElementById('fileList').value;
            fetch(`/archive/${filename}`)
                .then(response => response.text())
                .then(data => {
                    updateFileList();
                    setTimeout("loadFile();", 100);
                    showToast(`'${filename}' deleted.`);
                });
        }

        function loadFile() {
            const filename = document.getElementById('fileList').value;
            fetch(`/load/${filename}`)
                .then(response => response.text())
                .then(data => {
                    editor.setValue(data);
                });
        }

        function saveFile() {
            const filename = document.getElementById('fileList').value;
            const content = editor.getValue();
            fetch('/save', {
                method: 'POST',
                body: `${filename}:${content}`
            }).then(response => {
                showToast(`'${filename}' saved.`);
            });
        }

        const autoScrollButton = document.getElementById("autoscrollCheckbox");
        var autoScroll = true;
        autoScrollButton.checked = autoScroll;
        autoScrollButton.onchange = function(event) {
            autoScroll = autoScrollButton.checked;
        }

        const executeButton = document.getElementById("executeButton");
        const outputBox = document.getElementById("output");

        function renameFile() {
            const filename = document.getElementById('fileList').value;
            const newName = document.getElementById('renameInput').value;
            fetch(`/rename`, {
                method: 'POST',
                body: `${filename}:${newName}`
            }).then(response => response.text())
              .then(data => {
                updateFileList();
                if (data) {
                    setTimeout(`document.getElementById('fileList').value = '${data}';`, 200);
                    showToast(`File '${filename}' renamed to '${data}'.`);
                }
            })
        }

        var socket;
        var codeRunning = false;
        function executeFile() {
            executeButton.innerText = "Stop";
            mobileExecuteButton.innerText = "Stop";
            
            const filename = document.getElementById('fileList').value;
            
            fetch(`/execute`, {
                method: 'POST',
                body: filename
            }).then(response => response.text())
              .then(data => {
            console.log(data);
            if (data == "SCRIPT_START_SIGNAL") {
                codeRunning = true;
                socket = new WebSocket(`ws://10.1.1.1:8765/${filename}`);
                socket.onmessage = function(event) {
                if (event.data == "SCRIPT_ENDED_SIGNAL") {
                    executeButton.innerText = "Run";
                    mobileExecuteButton.innerText = "Run";
                    showToast(`'${filename}' ended.`)
                    return;
                }
                appendToConsole(event.data);
            };
            } else if (data == "SCRIPT_END_SIGNAL") {
                socket.close();
                codeRunning = false;
            }
            });
        }

        function clearOutput() {
            outputBox.innerText = "";
        }

        document.addEventListener('keydown', e => {
            if (e.ctrlKey && e.key === 's') {
                e.preventDefault();
                saveFile();
            }
        });

        let icon = {
            success:
            '<span class="material-symbols-outlined">task_alt</span>',
            danger:
            '<span class="material-symbols-outlined">error</span>',
            warning:
            '<span class="material-symbols-outlined">warning</span>',
            info:
            '<span class="material-symbols-outlined">info</span>',
        };
        function showToast(
            message = "Sample Message",
            toastType = "info",
            duration = 5000) {
            if (!Object.keys(icon).includes(toastType))
                toastType = "info";

            let box = document.createElement("div");
            box.classList.add(
                "toast", `toast-${toastType}`);
            box.innerHTML = ` <div class="toast-content-wrapper">
                        <div class="toast-icon">
                        ${icon[toastType]}
                        </div>
                        <div class="toast-message">${message}</div>
                        <div class="toast-progress"></div>
                        </div>`;
            duration = duration || 5000;
            box.querySelector(".toast-progress").style.animationDuration =
                    `${duration / 1000}s`;

            let toastAlready = 
                document.body.querySelector(".toast");
            if (toastAlready) {
                toastAlready.remove();
            }

            document.body.appendChild(box)
        };
        
        updateFileList();
        setTimeout("loadFile();", 150);
    </script>
</body>
</html>
