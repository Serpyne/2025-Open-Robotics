<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TS UI</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.0/ace.js"></script>
    <link rel="stylesheet" href="styles/index.css">
    <link rel="stylesheet" href="styles/toast.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body class="dark-mode">
    <header>
        <div class="header-title">TS UI</div>
        <div class="header-controls">
            <button id="mobileExecuteButton" class="btn btn-primary" onclick="executeFile()" title="Run">▶ Run</button>
        </div>
        <button class="theme-toggle" id="themeToggle" title="Toggle theme">🌙</button>
    </header>

    <div class="sidebar">
        <div class="sidebar-content">
            <button class="sidebar-toggle" id="sidebarToggle" title="Toggle sidebar">≡</button>
            
            <div class="rename-container">
                <input type="text" class="rename-input" id="renameInput" placeholder="New filename">
                <button class="btn btn-primary" onclick="renameFile()" data-tooltip="Rename">✓</button>
            </div>
            
            <select id="fileList">
                <!-- Options will be populated dynamically -->
            </select>
            
            <button class="btn btn-primary" onclick="newFile()" data-tooltip="New File">New File</button>
            <button class="btn btn-primary" onclick="loadFile()" data-tooltip="Load">Load</button>
            <button class="btn btn-danger" onclick="confirmArchive()" data-tooltip="Archive">Archive</button>
            
            <div class="button-group">
                <button class="btn btn-primary" onclick="saveFile()" data-tooltip="Save">Save</button>
                <button class="btn btn-primary" id="executeButton" onclick="executeFile()" data-tooltip="Run">Run</button>
            </div>
        </div>
    </div>

    <div class="editor-container">
        <div id="editor"></div>
    </div>

    <div class="console-container">
        <div class="console-header">
            <div class="console-header-title">Console Output</div>
            <div class="console-controls">
                <label class="autoscroll-toggle">
                    <span>Autoscroll</span>
                    <div class="checkbox-container">
                        <input type="checkbox" id="autoscrollCheckbox" checked>
                        <span class="checkbox-slider"></span>
                    </div>
                </label>
            </div>
        </div>
        <div class="console-output" id="consoleOutput"></div>
    </div>

    <script>
        // Initialize Ace Editor
        const editor = ace.edit("editor");
        editor.setTheme("ace/theme/monokai");
        editor.session.setMode("ace/mode/python");
        editor.setOption("copyWithEmptySelection", true);
        editor.setOptions({
            fontSize: "14px",
            enableBasicAutocompletion: true,
            enableLiveAutocompletion: true,
            showPrintMargin: false
        });

        // Theme toggle functionality
        const themeToggle = document.getElementById('themeToggle');
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            
            themeToggle.textContent = isLight ? '☀️' : '🌙';
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            
            // Update editor theme
            const editor = ace.edit("editor");
            editor.setTheme(isLight ? "ace/theme/chrome" : "ace/theme/monokai");
            
            // Force console to update by toggling a class
            const consoleContainer = document.querySelector('.console-container');
            consoleContainer.classList.toggle('light-console', isLight);
        });

        // Initialize theme
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-mode');
            themeToggle.textContent = '☀️';
            ace.edit("editor").setTheme("ace/theme/chrome");
            document.querySelector('.console-container').classList.add('light-console');
        }

        // Sidebar toggle functionality
        const sidebarToggle = document.getElementById('sidebarToggle');
        const sidebar = document.querySelector('.sidebar');
        const mobileExecuteButton = document.getElementById('mobileExecuteButton');
        sidebarToggle.addEventListener('click', () => {
            sidebar.classList.toggle('collapsed');
            sidebarToggle.textContent = sidebar.classList.contains('collapsed') ? '≡' : '☰';
            mobileExecuteButton.style.display = sidebar.classList.contains('collapsed') ? 'block' : 'none';
        });

        // Console output with autoscroll
        const consoleOutput = document.getElementById('consoleOutput');
        const autoscrollCheckbox = document.getElementById('autoscrollCheckbox');
        
        function appendToConsole(text) {
            consoleOutput.textContent += text;
            if (autoscrollCheckbox.checked) {
                consoleOutput.scrollTop = consoleOutput.scrollHeight;
            }
        }

        const select = document.getElementById('fileList');
        select.addEventListener("change", () => {
            setTimeout("loadFile();", 100);
        });
                    
        function updateFileList() {
            fetch('/list')
                .then(response => response.text())
                .then(data => {
                    const files = data.split('\n');
                    select.innerHTML = '';
                    files.forEach(file => {
                        const option = document.createElement('option');
                        option.text = file;
                        select.add(option);
                    });
                });
        }

        function newFile() {
            fetch(`/new`)
                .then(response => response.text())
                .then(data => {
                    let filename = data.toString();
                    console.log(filename);
                    updateFileList();
                    setTimeout(`document.getElementById('fileList').value = '${filename}';`, 10);
                    setTimeout("loadFile();", 100);
                    showToast(`New file '${filename}' created.`);
                });
        }

        function confirmArchive() {
            const fileList = document.getElementById('fileList');
            const selectedFile = fileList.value;
            
            if (!selectedFile) {
                appendToConsole('> No file selected');
                return;
            }

            if (confirm(`Are you sure you want to archive "${selectedFile}"? This action cannot be undone.`)) {
                archiveFile();
            } else {
                appendToConsole('> Delete canceled');
            }
        }
        function archiveFile() {
            const filename = document.getElementById('fileList').value;
            fetch(`/archive/${filename}`)
                .then(response => response.text())
                .then(data => {
                    updateFileList();
                    setTimeout("loadFile();", 100);
                    showToast(`'${filename}' deleted.`);
                });
        }

        function loadFile() {
            const filename = document.getElementById('fileList').value;
            fetch(`/load/${filename}`)
                .then(response => response.text())
                .then(data => {
                    editor.setValue(data);
                });
        }

        function saveFile() {
            const filename = document.getElementById('fileList').value;
            const content = editor.getValue();
            fetch('/save', {
                method: 'POST',
                body: `${filename}:${content}`
            }).then(response => {
                showToast(`'${filename}' saved.`);
            });
        }

        const autoScrollButton = document.getElementById("autoscrollCheckbox");
        var autoScroll = true;
        autoScrollButton.checked = autoScroll;
        autoScrollButton.onchange = function(event) {
            autoScroll = autoScrollButton.checked;
        }

        const executeButton = document.getElementById("executeButton");
        const outputBox = document.getElementById("output");

        function renameFile() {
            const filename = document.getElementById('fileList').value;
            const newName = document.getElementById('renameInput').value;
            fetch(`/rename`, {
                method: 'POST',
                body: `${filename}:${newName}`
            }).then(response => response.text())
              .then(data => {
                updateFileList();
                if (data) {
                    setTimeout(`document.getElementById('fileList').value = '${data}';`, 200);
                    showToast(`File '${filename}' renamed to '${data}'.`);
                }
            })
        }

        var socket;
        function executeFile() {
            executeButton.innerText = "Stop";
            mobileExecuteButton.innerText = "Stop";
            
            const filename = document.getElementById('fileList').value;
            
            fetch(`/execute`, {
                method: 'POST',
                body: filename
            }).then(response => response.text())
              .then(data => {
            console.log(data);
            if (data == "SCRIPT_START_SIGNAL") {
            socket = new WebSocket(`ws://10.1.1.1:8765/${filename}`);
            socket.onmessage = function(event) {
                if (event.data == "SCRIPT_ENDED_SIGNAL") {
                    executeButton.innerText = "Run";
                    mobileExecuteButton.innerText = "Run";
                    showToast(`'${filename}' ended.`)
                    return;
                }
                appendToConsole(event.data);
            };
            } else if (data == "SCRIPT_END_SIGNAL") {
                socket.close();
            }
            });
        }

        function clearOutput() {
            outputBox.innerText = "";
        }

        document.addEventListener('keydown', e => {
            if (e.ctrlKey && e.key === 's') {
                e.preventDefault();
                saveFile();
            }
        });

        let icon = {
            success:
            '<span class="material-symbols-outlined">task_alt</span>',
            danger:
            '<span class="material-symbols-outlined">error</span>',
            warning:
            '<span class="material-symbols-outlined">warning</span>',
            info:
            '<span class="material-symbols-outlined">info</span>',
        };
        function showToast(
            message = "Sample Message",
            toastType = "info",
            duration = 5000) {
            if (!Object.keys(icon).includes(toastType))
                toastType = "info";

            let box = document.createElement("div");
            box.classList.add(
                "toast", `toast-${toastType}`);
            box.innerHTML = ` <div class="toast-content-wrapper">
                        <div class="toast-icon">
                        ${icon[toastType]}
                        </div>
                        <div class="toast-message">${message}</div>
                        <div class="toast-progress"></div>
                        </div>`;
            duration = duration || 5000;
            box.querySelector(".toast-progress").style.animationDuration =
                    `${duration / 1000}s`;

            let toastAlready = 
                document.body.querySelector(".toast");
            if (toastAlready) {
                toastAlready.remove();
            }

            document.body.appendChild(box)
        };
        
        updateFileList();
        setTimeout("loadFile();", 150);
    </script>
</body>
</html>
